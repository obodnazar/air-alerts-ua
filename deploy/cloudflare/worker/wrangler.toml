name = "shkilnyi-ranok"
main = "src/index.js"
compatibility_date = "2026-09-01"

# every minute: deliver what is due by Kyiv local time (DST-aware); every 5th minute also read t.me/s for the live
# alert state and run the daily cleanup. One schedule of the 5 allowed per account.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "shkilnyi-ranok"
database_id = "eb7dfd4f-fd37-4b86-b7fd-55c14629863e"

# secrets (never in this file): TELEGRAM_BOT_TOKEN, WEBHOOK_SECRET, INGEST_SECRET
