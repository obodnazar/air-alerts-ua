name: forecast
# Computes the bot's forecast and pushes it to the Cloudflare Worker. Two UTC times per slot cover
# summer (EEST, UTC+3) and winter (EET, UTC+2); the script checks Kyiv time, and the Worker keeps the first
# forecast of a day if both runs fall inside the window.
on:
  schedule:
    # main runs start ~20 min early and wait for 20:00 / 08:00 inside the script (GitHub cron is often 5-20 min late);
    # the later ones are backups, the Worker answers 409 if the forecast is already in.
    # Every day, not only school days: the hourly-risk parameters and the alert history are sent on weekends too
    # (the script skips the school forecast itself when the target day has no school). Still two windows a day:
    # the live "now" comes from the Worker's own scrape, never from frequent Actions runs.
    - cron: "41 16 * * *"  # 19:41 Kyiv in summer time
    - cron: "41 17 * * *"  # 19:41 Kyiv in winter time (20:41 in summer: backup)
    - cron: "5 18 * * *"   # 20:05 Kyiv in winter time (21:05 in summer: backup)
    - cron: "41 4 * * *"   # 07:41 Kyiv in summer time
    - cron: "41 5 * * *"   # 07:41 Kyiv in winter time (08:41 in summer: backup)
    - cron: "2 6 * * *"    # 08:02 Kyiv in winter time (09:02 in summer: backup)
  workflow_dispatch:
    inputs:
      force:
        description: "kind and day, e.g. 'evening 2026-10-13' (empty = decide by Kyiv time)"
        required: false
concurrency:
  group: forecast
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: restore scraped posts from the previous run
        uses: actions/cache/restore@v4
        with:
          path: data/raw/telegram
          key: posts-${{ github.run_id }}
          restore-keys: posts-
      - name: download datasets
        run: PYTHONPATH=src python -m airalerts.sources.vadimkin && PYTHONPATH=src python -m airalerts.sources.kaggle
      - name: forecast and push
        env:
          INGEST_URL: ${{ secrets.INGEST_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
          FORCE: ${{ inputs.force }}   # via env, never pasted into the script: no shell injection (audit round 2)
        run: |
          args=()
          if [ -n "$FORCE" ]; then read -r kind day rest <<< "$FORCE"; args=(--force "$kind" "$day"); fi
          PYTHONPATH=src python -m airalerts.botapp.publish "${args[@]}"
      - name: keep scraped posts for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/raw/telegram
          key: posts-${{ github.run_id }}
